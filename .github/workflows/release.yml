name: Release Multiplatform

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.ps1 | iex
        shell: powershell

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install Python Dependencies and PyInstaller
        run: |
          uv venv
          .venv\Scripts\activate
          uv pip install -r backend/requirements.txt
          uv pip install pyinstaller

      - name: Compile Executable with PyInstaller
        shell: bash
        run: |
          source .venv/Scripts/activate
          pyinstaller --noconfirm --onedir --windowed \
            --name "Parf-Gonodol" \
            --add-data "frontend/dist;frontend/dist" \
            --add-data "desktop/icon.png;desktop" \
            --add-data "desktop/icon.svg;desktop" \
            desktop/entrypoint.py

      - name: Create Portable Zip
        shell: bash
        run: |
          cd dist
          tar -a -c -f Parf-Gonodol-Portable-Windows.zip Parf-Gonodol

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/Parf-Gonodol-Portable-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install Dependencies and PyInstaller
        run: |
          $HOME/.local/bin/uv venv
          source .venv/bin/activate
          $HOME/.local/bin/uv pip install -r backend/requirements.txt
          $HOME/.local/bin/uv pip install pyinstaller pyqt6 pyqt6-webengine

      - name: Compile Linux Binary
        run: |
          source .venv/bin/activate
          pyinstaller --noconfirm --onedir --windowed \
            --name "Parf-Gonodol" \
            --add-data "frontend/dist:frontend/dist" \
            --add-data "desktop/icon.png:desktop" \
            --add-data "desktop/icon.svg:desktop" \
            desktop/entrypoint.py
          cd dist
          tar -czvf Parf-Gonodol-Linux.tar.gz Parf-Gonodol

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/Parf-Gonodol-Linux.tar.gz

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/windows-release/*.zip
            release-artifacts/linux-release/*.tar.gz
          generate_release_notes: true
