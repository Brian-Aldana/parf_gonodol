name: Release Multiplatform

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build Frontend
        shell: bash
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install Python Dependencies and PyInstaller
        shell: bash
        run: |
          uv venv .venv
          uv pip install --python .venv -r backend/requirements.txt
          uv pip install --python .venv pyinstaller

      - name: Compile Executable with PyInstaller
        shell: bash
        run: |
          .venv/Scripts/pyinstaller --noconfirm --onedir --windowed \
            --name "Parf-Gonodol" \
            --icon "desktop/icon.ico" \
            --paths "backend" \
            --add-data "backend/app;app" \
            --add-data "frontend/dist;frontend/dist" \
            --add-data "desktop/icon.png;desktop" \
            --add-data "desktop/icon.ico;desktop" \
            --add-data "desktop/icon.svg;desktop" \
            desktop/entrypoint.py

      - name: Create Portable Zip
        shell: bash
        run: |
          cd dist
          tar -a -c -f Parf-Gonodol-Portable-Windows.zip Parf-Gonodol

      - name: Build Windows Installer with Inno Setup
        shell: bash
        run: |
          choco install innosetup -y
          iscc desktop/installer.iss

      - name: Stage Windows Release Assets
        shell: bash
        run: |
          mkdir -p release-windows
          cp dist/Parf-Gonodol-Portable-Windows.zip release-windows/
          cp dist-installer/Parf-Gonodol-Setup.exe release-windows/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-windows/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install Dependencies and PyInstaller
        run: |
          uv venv .venv
          uv pip install --python .venv -r backend/requirements.txt
          uv pip install --python .venv pyinstaller pyqt6 pyqt6-webengine

      - name: Compile Linux Binary
        run: |
          .venv/bin/pyinstaller --noconfirm --onedir --windowed \
            --name "Parf-Gonodol" \
            --paths "backend" \
            --add-data "backend/app:app" \
            --add-data "frontend/dist:frontend/dist" \
            --add-data "desktop/icon.png:desktop" \
            --add-data "desktop/icon.svg:desktop" \
            desktop/entrypoint.py
          cd dist
          tar -czvf Parf-Gonodol-Linux.tar.gz Parf-Gonodol

      - name: Stage Linux Release Assets
        run: |
          mkdir -p release-linux
          cp dist/Parf-Gonodol-Linux.tar.gz release-linux/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release-linux/*

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.exe
            release-artifacts/**/*.tar.gz
          overwrite: true
          generate_release_notes: true
